[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asco"
version = "0.1.0"
description = "A small terminal dispatcher for a software company."
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pexpect>=4.9,<5", "pyte>=0.8,<1"]

[tool.setuptools]
packages = ["asco"]
